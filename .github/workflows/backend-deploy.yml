name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Using Node 24 to match local environment
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Run linting and tests if they are added in the future
      # - name: Run Linter
      #   run: npm run lint --if-present

      # - name: Run Tests
      #   run: npm test --if-present

      - name: Build Application
        run: npm run build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-test # Only deploy if build succeeds

    steps:
      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Navigate to the project directory
            # IMPORTANT: Update this path to match your actual server directory on EC2!
            cd ~/at-jwellers/server
            
            # 2. Pull latest code from the main branch
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Install dependencies
            npm install
            
            # 4. Generate Prisma Client
            npx prisma generate
            
            # 5. Run Database Migrations (applies pending migrations without resetting data)
            npx prisma migrate deploy
            
            # 6. Build the TypeScript project
            npm run build
            
            # 7. Restart or Start PM2 Process safely
            if pm2 info server > /dev/null 2>&1; then
              echo "Process exists. Reloading..."
              pm2 reload server --update-env
            else
              echo "Process does not exist. Starting new process..."
              pm2 start dist/server.js --name "server"
            fi
            
            # 8. Save PM2 state to restart on boot
            pm2 save
